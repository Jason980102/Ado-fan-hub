services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ado_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ado_fan_hub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ado_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ado_app -d ado_fan_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ado_postgres_data:
